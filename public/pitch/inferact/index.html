<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AMD and IBM grant · ROCm on POWER9</title>
  <meta name="description" content="Abhishek Enaguthi. AMD and IBM grant. ROCm + HIP on POWER9 bring-up, then kernels and ML workloads." />
  <link rel="canonical" href="https://enaguthi.com/inferact-deep-dive/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    :root {
      --ink: #1c1412;
      --muted: #6f6562;
      --paper: #ffffff;
      --wash: #faf7f5;
      --line: #ebe4e0;
      --shell: #faf6f3;
      --signal: #e86f4c;
      --ok: #2f9e6b;
      --term: #0e0c0b;
      --term-fg: #e8ddd6;
      --term-dim: #8a7c74;
      --term-line: #2a2420;
      --kw: #e8c47c;
      --hi: #7eb8d4;
      --ok-term: #7dcea0;
      --amd-red: #ed1c24;
      --amd-orange: #f26522;
      --amd-teal: #4ec4e0;
      --cream: #f3e4d2;
      --shadow: rgba(10, 10, 10, 0.28);
      --shadow-ring: rgba(10, 10, 10, 0.06);
      --serif: "Instrument Serif", "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, "Times New Roman", serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color-scheme: light;
    }
    html.dark {
      --ink: #f4ece7;
      --muted: #b3a59e;
      --paper: #12100e;
      --wash: #1a1614;
      --line: #2f2926;
      --shell: #171310;
      --signal: #ef7d5a;
      --ok: #6dcea0;
      --shadow: rgba(0, 0, 0, 0.55);
      --shadow-ring: rgba(255, 255, 255, 0.06);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--wash);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button { font: inherit; color: inherit; }
    .serif { font-family: var(--serif); font-weight: 400; font-synthesis: none; }

    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      background: var(--wash);
    }
    .glow {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 70% at 8% 108%, rgba(232, 111, 76, 0.10), transparent 70%),
        radial-gradient(ellipse 40% 50% at 92% -8%, rgba(28, 20, 18, 0.04), transparent 65%);
    }
    html.dark .glow {
      background:
        radial-gradient(ellipse 55% 70% at 8% 108%, rgba(237, 28, 36, 0.18), transparent 70%),
        radial-gradient(ellipse 42% 52% at 94% -6%, rgba(242, 101, 34, 0.14), transparent 65%);
    }

    .top {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 24px;
    }
    .brand {
      font-family: var(--serif);
      font-size: 1.125rem;
      font-weight: 400;
      font-synthesis: none;
      color: var(--ink);
      text-decoration: none;
    }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn, .ghost, .solid, .nav-btn {
      border-radius: 999px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .ghost, .solid, .nav-btn {
      padding: 6px 14px;
      font-size: 0.875rem;
    }
    .solid {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .solid:disabled, .ghost:disabled { opacity: 0.3; cursor: default; }
    .sections-toggle { display: none; }

    .body {
      position: relative;
      z-index: 10;
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      gap: 16px;
      padding: 0 20px 8px;
    }
    .jump {
      width: 176px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .jump-label {
      margin: 0 0 8px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .jump nav { display: flex; flex-direction: column; gap: 2px; }
    .jump button {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .jump button:hover { background: var(--paper); color: var(--ink); }
    .jump button.on { background: var(--ink); color: var(--paper); }
    .jump .appendix-toggle {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .jump .appendix-list {
      display: none;
      flex-direction: column;
      gap: 2px;
      margin: 2px 0 0 8px;
      padding-left: 8px;
      border-left: 1px solid var(--line);
    }
    .jump .appendix-list.open { display: flex; }

    .stage {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 0 1px 2px var(--shadow-ring), 0 18px 48px -24px var(--shadow);
    }
    .slide {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      padding: 18px 28px 18px;
    }
    .slide.on { display: flex; animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .slide.cover { align-items: stretch; justify-content: flex-start; text-align: left; overflow-y: auto; }
    .slide.fill { justify-content: flex-start; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide.on { animation: none; }
    }

    .eyebrow {
      margin: 0;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--signal);
    }
    h1 {
      margin: 6px 0 0;
      flex-shrink: 0;
      max-width: none;
      font-family: var(--serif);
      font-size: clamp(1.5rem, 2.8vw, 2.2rem);
      font-weight: 400;
      font-synthesis: none;
      line-height: 1.16;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    .cover h1 {
      max-width: none;
      font-size: clamp(2rem, 4.4vw, 3.35rem);
      line-height: 1.06;
    }
    .lede {
      margin: 10px 0 0;
      max-width: 36em;
      font-size: clamp(0.98rem, 1.5vw, 1.18rem);
      color: var(--muted);
      line-height: 1.4;
    }
    .hint {
      margin: 8px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .gloss {
      margin: 8px 0 0;
      max-width: 42em;
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .gloss b { color: var(--ink); font-weight: 600; }
    .col-label {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .col-label.ok { color: var(--ok); }
    .col-label.bad { color: var(--signal); }

    .grow {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-top: 12px;
      gap: 10px;
    }

    .marks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--wash);
      border-radius: 999px;
      padding: 5px 10px 5px 6px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .mark i {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: var(--ink);
      color: var(--paper);
      font-style: normal;
      font-size: 10px;
      font-weight: 600;
    }
    .mark.amd i { background: #ed1c24; }
    .mark.ibm i { background: #054ada; }
    .mark.hip i { background: #e86f4c; }

    .split {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 12px;
    }
    .split.even { grid-template-columns: 1fr 1fr; }
    .split.wide-right { grid-template-columns: 0.92fr 1.08fr; }

    .machine {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 56px 1fr;
      align-items: stretch;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--wash) 70%, transparent), var(--wash)),
        repeating-linear-gradient(0deg, transparent, transparent 23px, color-mix(in srgb, var(--line) 70%, transparent) 24px);
      border-radius: 14px;
      padding: 12px;
    }
    .box {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .box.had {
      border-color: color-mix(in srgb, var(--signal) 55%, var(--line));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--signal) 25%, transparent);
    }
    .box-kicker {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .box.had .box-kicker { color: var(--signal); }
    .box-title {
      font-family: var(--serif);
      font-size: clamp(1.25rem, 2.2vw, 1.7rem);
      line-height: 1.1;
    }
    .box-meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
    .box ul {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .box li {
      font-size: 13px;
      color: var(--muted);
      padding-left: 12px;
      position: relative;
    }
    .box li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background: var(--signal);
    }
    .bus {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--signal);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
    }
    .bus svg { width: 28px; height: 28px; }

    .arch {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .layer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--wash);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
    }
    .layer b { font-weight: 600; }
    .layer span {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
    .layer.gpu {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
      box-shadow: inset 3px 0 0 var(--amd-red);
    }
    .layer.gpu span { color: color-mix(in srgb, var(--paper) 70%, transparent); }
    .layer.broke {
      border-color: color-mix(in srgb, var(--signal) 50%, var(--line));
      background: color-mix(in srgb, var(--signal) 12%, var(--paper));
    }
    .layer.ok {
      border-color: color-mix(in srgb, var(--ok) 45%, var(--line));
      background: color-mix(in srgb, var(--ok) 10%, var(--paper));
    }

    .term {
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--term);
      color: var(--term-fg);
      border: 1px solid var(--term-line);
      border-radius: 12px;
      box-shadow: 0 12px 32px -18px rgba(0,0,0,0.7);
    }
    .term-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #171310;
      border-bottom: 1px solid var(--term-line);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--term-dim);
    }
    .dots { display: flex; gap: 5px; }
    .dots i {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: #3a3330;
      font-style: normal;
    }
    .dots i:nth-child(1) { background: #c45c4a; }
    .dots i:nth-child(2) { background: #c4a15a; }
    .dots i:nth-child(3) { background: #5aa36b; }
    .term-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      margin: 0;
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: clamp(11px, 1.05vw, 12.5px);
      line-height: 1.55;
      white-space: pre;
    }
    .term .p { color: var(--ok-term); }
    .term .k { color: var(--kw); }
    .term .c { color: var(--hi); }
    .term .d { color: var(--term-dim); }
    .term .f { color: #ef7d5a; }
    .term .g { color: var(--ok-term); font-weight: 600; }
    .term .w { color: #f4ece7; }
    .term .num { color: #f0c14a; }

    .term.sim {
      position: relative;
      background:
        linear-gradient(180deg, rgba(237, 28, 36, 0.08), transparent 26%),
        var(--term);
      box-shadow:
        0 12px 32px -18px rgba(0,0,0,0.7),
        inset 0 0 0 1px rgba(242, 101, 34, 0.18);
    }
    .term.sim .term-bar {
      background: #1a120f;
    }
    .term.sim .term-body {
      white-space: normal;
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.018) 3px
      );
    }
    .term.sim .p { color: #5ee0a0; }
    .term.sim .c { color: var(--amd-teal); }
    .term.sim .k, .term.sim .num { color: #f0c14a; }
    .term.sim .g {
      color: #5ee0a0;
      display: inline-block;
      text-shadow: 0 0 12px rgba(94, 224, 160, 0.45);
    }
    .term.sim .f { color: #ff6b5a; }
    .term-live {
      margin-left: auto;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--term-dim);
    }
    .term-live.go {
      color: var(--amd-orange);
    }
    .term-live.go::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 6px;
      border-radius: 99px;
      background: var(--amd-orange);
      box-shadow: 0 0 8px var(--amd-orange);
      animation: livePulse 1s ease infinite;
    }
    .term-live.ok {
      color: #5ee0a0;
    }
    .term-live.ok::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 6px;
      border-radius: 99px;
      background: #5ee0a0;
      box-shadow: 0 0 8px #5ee0a0;
    }
    .term-line {
      white-space: pre;
      min-height: 1.55em;
      animation: termIn 0.24s ease both;
    }
    .term-cursor {
      display: inline-block;
      width: 7px;
      height: 1.05em;
      margin-left: 2px;
      vertical-align: text-bottom;
      background: #5ee0a0;
      box-shadow: 0 0 8px rgba(94, 224, 160, 0.55);
      animation: caret 1s steps(1) infinite;
    }
    .term-line.pass-flash .g { animation: passPop 0.55s ease; }
    .stack-live .layer {
      position: relative;
      overflow: hidden;
      transition: background 0.28s ease, border-color 0.28s ease, color 0.28s ease, box-shadow 0.28s ease;
    }
    .stack-live .layer.run {
      background: var(--cream);
      color: #1c1412;
      border-color: var(--amd-orange);
      box-shadow:
        0 0 0 1px rgba(242, 101, 34, 0.35),
        0 10px 24px -14px rgba(237, 28, 36, 0.55);
    }
    .stack-live .layer.run span { color: #6f4a38; }
    .stack-live .layer.run::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--amd-orange);
    }
    .stack-live .layer.done {
      border-color: color-mix(in srgb, var(--ok) 55%, var(--line));
      background: color-mix(in srgb, var(--ok) 14%, var(--paper));
    }
    .stack-live .layer.gpu.run {
      background: var(--cream);
      color: #1c1412;
      border-color: var(--amd-red);
      box-shadow: inset 3px 0 0 var(--amd-red), 0 10px 24px -14px rgba(237, 28, 36, 0.55);
    }
    .stack-live .layer.gpu.run span { color: #6a4034; }
    .stack-live .layer.gpu.done {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
      box-shadow: inset 3px 0 0 #5ee0a0;
    }
    .stack-live .layer.gpu.done span { color: color-mix(in srgb, var(--paper) 70%, transparent); }
    .arch .layer.broke-forced {
      border-color: color-mix(in srgb, var(--signal) 50%, var(--line));
      background: color-mix(in srgb, var(--signal) 12%, var(--paper));
    }
    .arch .layer.ok-forced {
      border-color: color-mix(in srgb, var(--ok) 45%, var(--line));
      background: color-mix(in srgb, var(--ok) 10%, var(--paper));
    }
    @keyframes caret {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes termIn {
      from { opacity: 0; transform: translateX(-5px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes passPop {
      0% { transform: scale(1); filter: brightness(1); }
      40% { transform: scale(1.08); filter: brightness(1.45); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .term-line, .term-cursor, .term-live.go::before, .term-line.pass-flash .g { animation: none; }
    }


    .box.dim { opacity: 0.45; filter: saturate(0.7); transition: opacity 0.35s ease, filter 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease; }
    .box.lit {
      opacity: 1;
      filter: none;
      border-color: color-mix(in srgb, var(--amd-orange) 55%, var(--line));
      box-shadow: 0 0 0 1px rgba(242, 101, 34, 0.28), 0 14px 28px -18px rgba(237, 28, 36, 0.45);
    }
    .box.gpu-lit {
      border-color: color-mix(in srgb, var(--amd-red) 60%, var(--line));
      box-shadow: 0 0 0 1px rgba(237, 28, 36, 0.35), 0 14px 32px -16px rgba(237, 28, 36, 0.55);
    }
    .bus.lit { color: var(--amd-teal); text-shadow: 0 0 12px rgba(78, 196, 224, 0.45); }
    .mark.dim { opacity: 0.35; transition: opacity 0.3s ease, transform 0.3s ease; }
    .mark.pop { opacity: 1; transform: translateY(-1px); }
    .dual-term {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .failcard.dim { opacity: 0.42; filter: saturate(0.65); transition: opacity 0.3s ease, filter 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; }
    .failcard.run {
      opacity: 1;
      filter: none;
      border-color: color-mix(in srgb, var(--amd-orange) 55%, var(--line));
      box-shadow: 0 0 0 1px rgba(242, 101, 34, 0.3), 0 12px 28px -18px rgba(237, 28, 36, 0.4);
    }
    .failcard.done {
      opacity: 1;
      filter: none;
      border-color: color-mix(in srgb, var(--ok) 45%, var(--line));
    }
    .byte.flash { animation: passPop 0.45s ease; }
    .checklist {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border: 1px solid var(--line);
      background: var(--wash);
      border-radius: 12px;
      padding: 12px 14px;
      opacity: 0.35;
      transform: translateY(6px);

    function stopSim(name) {
      const ctx = sims[name];
      if (!ctx) return;

      sims[name] = null;
    }

    function newCtx(name) {
      stopSim(name);
      const ctx = { dead: false, timers: [] };
      sims[name] = ctx;
      return ctx;
    }

    function wait(ctx, ms) {
      return new Promise((resolve) => {
        if (ctx.dead) { resolve(); return; }
        const t = setTimeout(resolve, quiet() ? 0 : ms);
        ctx.timers.push(t);
      });
    }

        const id = n.getAttribute("data-phase");
        n.classList.remove("run", "done");
        if (id === phase) n.classList.add("run");
        else if (idx >= 0 && order.indexOf(id) < idx) n.classList.add("done");
      });
    }

    function finishPhases(stackId) {
      const root = document.getElementById(stackId);

    async function typeCmd(body, cmd, ctx) {
      const line = document.createElement("div");
      line.className = "term-line";
      const prompt = document.createElement("span");
      prompt.className = "p";
      prompt.textContent = "$ ";
      const typed = document.createElement("span");
      typed.className = "w";
      line.append(prompt, typed);
      body.appendChild(line);
      parkCursor(line);
      if (quiet()) {
        typed.textContent = cmd;
        body.scrollTop = body.scrollHeight;
        return;
      }
      for (const ch of cmd) {
        if (ctx.dead) return;
        typed.textContent += ch;
        body.scrollTop = body.scrollHeight;
        await wait(ctx, TYPE_MS);
      }
      await wait(ctx, CMD_PAUSE);
    }

      await typeCmd(t2, "file libfoo.so", ctx);
      if (ctx.dead) return;
      addLine(t2, `ELF 64-bit LSB`);
      await wait(ctx, LINE_FAST);
      if (ctx.dead) return;
      addLine(t2, `<span class="f">x86-64</span>, not PowerPC`);
      await wait(ctx, PHASE_PAUSE);
      if (ctx.dead) return;
      await typeCmd(t2, "hipcc main.hip", ctx);
      if (ctx.dead) return;
      addLine(t2, `<span class="f">cannot load:</span>`);
      await wait(ctx, LINE_FAST);
      if (ctx.dead) return;
      addLine(t2, `<span class="f">Exec format error</span>`, "pass-flash");
      await wait(ctx, LINE_DELAY);
      if (ctx.dead) return;
      addLine(t2, `<span class="d">tree builds. load fails.</span>`);
      await wait(ctx, PHASE_GAP);
      if (ctx.dead) return;
      markHard("hardCard2", "done");
      setLive("hardLive2", "ELF", "ok");

      markHard("hardCard3", "run");
      setLive("hardLive3", "kfd", "go");
      addLine(t3, `<span class="d">[12.408]</span> amdgpu: init`);
      await wait(ctx, LINE_DELAY);
      if (ctx.dead) return;
      addLine(t3, `<span class="d">[12.410]</span> expected <span class="k">x86</span> host`);
      await wait(ctx, PHASE_PAUSE);
      if (ctx.dead) return;
      addLine(t3, `<span class="f">[12.411] refuse probe on POWER</span>`, "pass-flash");
      await wait(ctx, PHASE_PAUSE);
      if (ctx.dead) return;
      addLine(t3, `<span class="d">user-mode is not enough</span>`);
      await wait(ctx, LINE_DELAY);
      if (ctx.dead) return;
      await typeCmd(t3, "make -C ROCK-Kernel-Driver", ctx);
      if (ctx.dead) return;
      addLine(t3, `  CC  <span class="c">kfd_device.o</span>`);
      await wait(ctx, BUILD_MS);
      if (ctx.dead) return;
      addLine(t3, `  LD  <span class="g">amdgpu.ko</span>`);
      await wait(ctx, HIP_DONE);
      if (ctx.dead) return;
      markHard("hardCard3", "done");
      setLive("hardLive3", "ROCK", "ok");
    }

    async function playProof() {
      const body = document.getElementById("proofTerm");
      if (!body) return;
      const ctx = newCtx("proof");
      const order = ["alloc", "copy", "launch", "check", "fw"];
      clearTerm(body);
      resetStack("proofStack");
      setLive("proofLive", "hipcc", "go");

      await typeCmd(body, "hipcc -O2 matmul.hip -o matmul", ctx);
      if (ctx.dead) return;
      await wait(ctx, LINE_DELAY);
      if (ctx.dead) return;
      await typeCmd(body, "./matmul", ctx);
      if (ctx.dead) return;
      await wait(ctx, HIP_WAIT);
      if (ctx.dead) return;

      setPhase("proofStack", order, "alloc");
      setLive("proofLive", "alloc", "go");
      addLine(body, `hipMalloc             <span class="g">hipSuccess</span>`);
      await wait(ctx, STEP_MS);
      if (ctx.dead) return;

      setPhase("proofStack", order, "copy");
      setLive("proofLive", "copy in", "go");
      addLine(body, `hipMemcpy H2D         <span class="g">hipSuccess</span>`);
      await wait(ctx, STEP_MS);
      if (ctx.dead) return;

      setPhase("proofStack", order, "launch");
      setLive("proofLive", "launch", "go");
      addLine(body, `hipLaunchKernelGGL    <span class="c">matmul_kernel</span>`);
      await wait(ctx, LAUNCH_MS);
      if (ctx.dead) return;

      setPhase("proofStack", order, "check");
      setLive("proofLive", "check", "go");
      addLine(body, `hipMemcpy D2H         <span class="g">hipSuccess</span>`);
      await wait(ctx, PHASE_PAUSE);
      if (ctx.dead) return;
      addLine(body, `max |GPU-CPU| = <span class="num">8.41e-06</span>`);
      await wait(ctx, HIP_WAIT);
      if (ctx.dead) return;
      addLine(body, `<span class="d">tol 1e-5</span>`);
      await wait(ctx, LINE_DELAY);
      if (ctx.dead) return;
      addLine(body, `<span class="g">PASS</span>`, "pass-flash");
      await wait(ctx, STEP_MS);
      if (ctx.dead) return;

      setPhase("proofStack", order, "fw");
      setLive("proofLive", "smokes", "go");
      await wait(ctx, FW_PAUSE);
      if (ctx.dead) return;
      finishPhases("proofStack");
      setLive("proofLive", "PASS", "ok");
    }

    async function playImprovements() {
      const body = document.getElementById("improveTerm");
      if (!body) return;
      const ctx = newCtx("improvements");
      const order = ["measure", "change", "ml", "gain"];
      clearTerm(body);
      resetStack("improveStack");
      setLive("improveLive", "profile", "go");

      setPhase("improveStack", order, "measure");
      await typeCmd(body, "rocprof --stats ./matmul", ctx);
      if (ctx.dead) return;
      addLine(body, `kernel   <span class="num">62%</span>  <span class="c">matmul_kernel</span>`);
      await wait(ctx, LINE_DELAY);
      if (ctx.dead) return;
      addLine(body, `memcpy   <span class="num">21%</span>`);
      await wait(ctx, LINE_FAST);
      if (ctx.dead) return;
      addLine(body, `launch   <span class="num">9%</span>`);
      await wait(ctx, PHASE_PAUSE);
      if (ctx.dead) return;

      setPhase("improveStack", order, "change");
      setLive("improveLive", "one path", "go");
      addLine(body, `<span class="d"></span>`);
      await typeCmd(body, "edit hot path · one change", ctx);
      if (ctx.dead) return;
      addLine(body, `<span class="c">kernel tile / memory env</span>`);
      await wait(ctx, LINE_DELAY);
      if (ctx.dead) return;
      await typeCmd(body, "./matmul --check", ctx);
      if (ctx.dead) return;
      addLine(body, `max |GPU-CPU| = <span class="num">7.2e-06</span>  <span class="g">PASS</span>`);
      await wait(ctx, PHASE_GAP);
      if (ctx.dead) return;

      setPhase("improveStack", order, "ml");
      setLive("improveLive", "ML loads", "go");
      addLine(body, `<span class="d"></span>`);
      await typeCmd(body, "python run_pt_tf_smokes.py", ctx);
      if (ctx.dead) return;
      addLine(body, `PyTorch   GPU util <span class="g">busy</span>`);
      await wait(ctx, LINE_DELAY);
      if (ctx.dead) return;
      addLine(body, `TensorFlow GPU util <span class="g">busy</span>`);
      await wait(ctx, PHASE_PAUSE);
      if (ctx.dead) return;

      setPhase("improveStack", order, "gain");
      setLive("improveLive", "re-measure", "go");
      addLine(body, `<span class="d"></span>`);
      await typeCmd(body, "re-measure targeted grant loads", ctx);
      if (ctx.dead) return;
      addLine(body, `baseline → after  <span class="g">~30%</span>`, "pass-flash");
      await wait(ctx, LINE_DELAY);
      if (ctx.dead) return;
      addLine(body, `<span class="d"># not a blanket number</span>`);
      await wait(ctx, HIP_DONE);
      if (ctx.dead) return;
      finishPhases("improveStack");
      setLive("improveLive", "~30%", "ok");
    }

    async function playOutcome() {
      const body = document.getElementById("outcomeTerm");
      if (!body) return;
      const ctx = newCtx("outcome");
      clearTerm(body);
      document.querySelectorAll("#outcomeList .check").forEach((c) => c.classList.remove("on"));
      setLive("outcomeLive", "check", "go");

      await typeCmd(body, "grant status", ctx);
      if (ctx.dead) return;
      await wait(ctx, LINE_DELAY);
      if (ctx.dead) return;

      const items = [
        ["stack", "ROCm + HIP on POWER9", "compiled · installed · running"],
        ["hip", "HIP matmul proof", "PASS vs CPU ~1e-5"],
        ["ml", "ML workloads", "PyTorch / TF GPU busy"],
        ["gain", "targeted grant loads", "~30% after bring-up"],
      ];
      for (const [key, label, detail] of items) {
        document.querySelector(`#outcomeList [data-out="${key}"]`)?.classList.add("on");
        addLine(body, `<span class="g">PASS</span>  <span class="w">${label}</span>`);
        await wait(ctx, LINE_FAST);
        if (ctx.dead) return;
        addLine(body, `      <span class="d">${detail}</span>`);
        await wait(ctx, PHASE_PAUSE);
        if (ctx.dead) return;
      }
      addLine(body, `<span class="d"></span>`);
      addLine(body, `<span class="g">outcome: stack running on that box</span>`, "pass-flash");
      setLive("outcomeLive", "PASS", "ok");
    }

    async function playFuture() {
      const body = document.getElementById("futureTerm");
      if (!body) return;
      const ctx = newCtx("future");
      clearTerm(body);
      document.querySelectorAll("#futureGrid .future-card").forEach((c) => c.classList.remove("on"));
      setLive("futureLive", "next", "go");

      await typeCmd(body, "grant roadmap", ctx);
      if (ctx.dead) return;
      await wait(ctx, LINE_DELAY);
      if (ctx.dead) return;

      const steps = [
        ["p10", "Power10 path", "same bring-up on the next POWER host"],
        ["ml", "More workloads", "more ML loads on the working recipe"],
        ["recipe", "Cleaner recipe", "workspace + docs for the next person"],
      ];
      for (const [key, title, detail] of steps) {
        document.querySelector(`#futureGrid [data-fut="${key}"]`)?.classList.add("on");
        addLine(body, `<span class="c">→</span> <span class="w">${title}</span>`);
        await wait(ctx, LINE_FAST);
        if (ctx.dead) return;
        addLine(body, `  <span class="d">${detail}</span>`);
        await wait(ctx, PHASE_PAUSE);
        if (ctx.dead) return;
      }
      setLive("futureLive", "next", "ok");
    }

    const SIM_IDS = ["cover", "problem", "owned", "hard", "proof", "improvements", "outcome", "future"];

    function startSlideSim(id) {
      SIM_IDS.forEach((name) => {
        if (name !== id) stopSim(name);
      });
      if (id === "cover") playCover();
      if (id === "problem") playProblem();
      if (id === "owned") playOwned();
      if (id === "hard") playHard();
      if (id === "proof") playProof();
      if (id === "improvements") playImprovements();
      if (id === "outcome") playOutcome();
      if (id === "future") playFuture();
    }

    function go(n) {
      i = Math.max(0, Math.min(n, SLIDES.length - 1));
      slideEls.forEach((el, k) => el.classList.toggle("on", k === i));
      const left = SLIDES.length - i - 1;
      count.textContent = `${i + 1} / ${SLIDES.length}` + (left > 0 ? ` · ${left} left` : " · last");
      prev.disabled = i === 0;
      next.disabled = i === SLIDES.length - 1;
      bars.querySelectorAll("button").forEach((b, k) => {
        b.className = k < i ? "done" : k === i ? "now" : "";
        if (SLIDES[k].appendix && !SLIDES[k - 1]?.appendix) b.classList.add("gap");
      });
      const id = SLIDES[i].id;
      history.replaceState(null, "", `${location.pathname}${location.search}#${id}`);
      if (SLIDES[i].appendix) appendixOpen = true;
      renderJump();
      menuBtn.textContent = "Sections";
      startSlideSim(id);
    }

    bars.innerHTML = "";
    SLIDES.forEach((s, idx) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", `Go to ${s.nav}`);
      b.onclick = () => go(idx);
      bars.appendChild(b);
    });

    prev.onclick = () => go(i - 1);
    next.onclick = () => go(i + 1);
    fsBtn.onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
    themeBtn.onclick = () => {
      applyTheme(document.documentElement.classList.contains("dark") ? "light" : "dark");
    };
    menuBtn.onclick = () => {
      const open = mobileMenu.classList.toggle("open");
      menuBtn.textContent = open ? "Close" : "Sections";
    };

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        e.preventDefault();
        go(i + 1);
      }
      if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        go(i - 1);
      }
      if (e.key === "Home") go(0);
      if (e.key === "End") go(SLIDES.length - 1);
      if (e.key === "f" || e.key === "F") {
        e.preventDefault();
        fsBtn.click();
      }
      if (e.key === "Escape") mobileMenu.classList.remove("open");
    });

    const app = document.getElementById("app");
    app.addEventListener("touchstart", (e) => {
      const t = e.changedTouches[0];
      if (!t) return;
      touchX = t.clientX;
      touchY = t.clientY;
    }, { passive: true });
    app.addEventListener("touchend", (e) => {
      const t = e.changedTouches[0];
      if (!t || touchX == null) return;
      const dx = t.clientX - touchX;
      const dy = t.clientY - touchY;
      touchX = touchY = null;
      if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
      if (dx < 0) go(i + 1);
      else go(i - 1);
    });

    (function initTheme() {
      let mode = "dark";
      try {
        const stored = localStorage.getItem("inferact-deck-theme");
        if (stored === "light" || stored === "dark") mode = stored;
      } catch (e) {}
      applyTheme(mode);
    })();

    go(indexFromHash());
    window.addEventListener("hashchange", () => go(indexFromHash()));
  </script>
</body>
</html>
