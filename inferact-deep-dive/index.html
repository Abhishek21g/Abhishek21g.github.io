<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ROCm on POWER9 · Inferact deep dive</title>
  <meta name="description" content="Abhishek Enaguthi — ROCm + HIP on POWER9. Inferact AMD GPU Performance Engineering deep dive." />
  <link rel="canonical" href="https://enaguthi.com/inferact-deep-dive/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    :root {
      --ink: #1c1412;
      --muted: #6f6562;
      --paper: #ffffff;
      --wash: #faf7f5;
      --line: #ebe4e0;
      --shell: #faf6f3;
      --signal: #e86f4c;
      --shadow: rgba(10, 10, 10, 0.28);
      --shadow-ring: rgba(10, 10, 10, 0.06);
      --serif: "Instrument Serif", "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, "Times New Roman", serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color-scheme: light;
    }
    html.dark {
      --ink: #f4ece7;
      --muted: #b3a59e;
      --paper: #12100e;
      --wash: #1a1614;
      --line: #2f2926;
      --shell: #171310;
      --signal: #ef7d5a;
      --shadow: rgba(0, 0, 0, 0.55);
      --shadow-ring: rgba(255, 255, 255, 0.06);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--wash);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button { font: inherit; color: inherit; }
    .serif { font-family: var(--serif); font-weight: 400; font-synthesis: none; }

    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      background: var(--wash);
    }
    .glow {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 70% at 8% 108%, rgba(232, 111, 76, 0.10), transparent 70%),
        radial-gradient(ellipse 40% 50% at 92% -8%, rgba(28, 20, 18, 0.04), transparent 65%);
    }
    html.dark .glow {
      background:
        radial-gradient(ellipse 55% 70% at 8% 108%, rgba(239, 125, 90, 0.12), transparent 70%),
        radial-gradient(ellipse 40% 50% at 92% -8%, rgba(244, 236, 231, 0.04), transparent 65%);
    }

    .top {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 24px;
    }
    .brand {
      font-family: var(--serif);
      font-size: 1.125rem;
      font-weight: 400;
      font-synthesis: none;
      color: var(--ink);
      text-decoration: none;
    }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn, .ghost, .solid, .nav-btn {
      border-radius: 999px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .ghost, .solid, .nav-btn {
      padding: 6px 14px;
      font-size: 0.875rem;
    }
    .solid {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .solid:disabled, .ghost:disabled { opacity: 0.3; cursor: default; }
    .sections-toggle { display: none; }

    .body {
      position: relative;
      z-index: 10;
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      gap: 16px;
      padding: 0 20px 8px;
    }
    .jump {
      width: 176px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .jump-label {
      margin: 0 0 8px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .jump nav { display: flex; flex-direction: column; gap: 2px; }
    .jump button {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .jump button:hover { background: var(--paper); color: var(--ink); }
    .jump button.on { background: var(--ink); color: var(--paper); }
    .jump .appendix-toggle {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .jump .appendix-list {
      display: none;
      flex-direction: column;
      gap: 2px;
      margin: 2px 0 0 8px;
      padding-left: 8px;
      border-left: 1px solid var(--line);
    }
    .jump .appendix-list.open { display: flex; }

    .stage {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 0 1px 2px var(--shadow-ring), 0 18px 48px -24px var(--shadow);
    }
    .slide {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      padding: 22px 36px 24px;
    }
    .slide.on { display: flex; animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .slide.cover { align-items: center; justify-content: center; text-align: center; overflow-y: auto; }
    .slide.fill { justify-content: flex-start; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide.on { animation: none; }
    }

    .eyebrow {
      margin: 0;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--signal);
    }
    h1 {
      margin: 8px 0 0;
      flex-shrink: 0;
      max-width: none;
      font-family: var(--serif);
      font-size: clamp(1.65rem, 3.1vw, 2.45rem);
      font-weight: 400;
      font-synthesis: none;
      line-height: 1.18;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    .cover h1 {
      max-width: 14ch;
      font-size: clamp(2.35rem, 5.4vw, 4.1rem);
      line-height: 1.08;
    }
    .lede {
      margin: 16px 0 0;
      max-width: 28em;
      font-size: clamp(1.02rem, 1.7vw, 1.28rem);
      color: var(--muted);
      line-height: 1.45;
    }
    .hint {
      margin: 22px 0 0;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .grow {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-top: 18px;
    }

    .contrast {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 52px 1fr;
      gap: 12px;
      align-items: stretch;
    }
    .panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--wash);
      border-radius: 16px;
      padding: 18px 20px;
    }
    .panel.had {
      border-color: color-mix(in srgb, var(--signal) 50%, var(--line));
      background: color-mix(in srgb, var(--signal) 11%, var(--paper));
    }
    .panel h2 {
      margin: 0;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .panel.had h2 { color: var(--signal); }
    .mega {
      margin: 4px 0 2px;
      font-family: var(--serif);
      font-size: clamp(1.8rem, 3.6vw, 2.7rem);
      font-weight: 400;
      font-synthesis: none;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .panel p {
      margin: 0;
      font-size: clamp(0.95rem, 1.5vw, 1.12rem);
      color: var(--muted);
      line-height: 1.45;
    }
    .vs {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .x-mark {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--signal);
      border-radius: 999px;
      color: var(--signal);
      background: var(--paper);
    }
    .x-mark svg { width: 16px; height: 16px; }

    .job {
      flex-shrink: 0;
      margin-top: 14px;
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--ink);
      color: var(--paper);
      font-size: clamp(1rem, 1.7vw, 1.22rem);
      line-height: 1.35;
    }

    .flow {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .step {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--wash);
      border-radius: 14px;
      padding: 16px 14px;
    }
    .step strong {
      display: block;
      font-size: clamp(1.02rem, 1.6vw, 1.22rem);
      font-weight: 600;
      line-height: 1.25;
    }
    .step span {
      color: var(--muted);
      font-size: clamp(0.85rem, 1.2vw, 0.98rem);
      line-height: 1.4;
    }
    .n {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font-size: 11px;
      font-weight: 600;
    }
    .arrow {
      flex-shrink: 0;
      align-self: center;
      color: var(--signal);
      width: 18px;
      height: 18px;
    }

    .trio {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .trio .step { padding: 18px 16px; }

    .loop {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: 1fr auto 1fr;
      gap: 10px;
      align-items: stretch;
    }
    .loop .step { min-height: 88px; }
    .loop .a { grid-column: 1; grid-row: 1; }
    .loop .b { grid-column: 3; grid-row: 1; }
    .loop .c { grid-column: 3; grid-row: 3; }
    .loop .d { grid-column: 1; grid-row: 3; }
    .loop .ab { grid-column: 2; grid-row: 1; align-self: center; }
    .loop .bc { grid-column: 3; grid-row: 2; justify-self: center; }
    .loop .cd { grid-column: 2; grid-row: 3; align-self: center; }
    .loop .da { grid-column: 1; grid-row: 2; justify-self: center; }
    .arr-down { transform: rotate(90deg); }
    .arr-left { transform: rotate(180deg); }
    .arr-up { transform: rotate(-90deg); }

    .grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .card {
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      background: var(--wash);
      border-radius: 14px;
      padding: 16px 18px;
    }
    .card.had {
      border-color: color-mix(in srgb, var(--signal) 50%, var(--line));
      background: color-mix(in srgb, var(--signal) 11%, var(--paper));
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .card.had h2 { color: var(--signal); }
    .card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .card li {
      font-size: clamp(1rem, 1.6vw, 1.22rem);
      line-height: 1.4;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      flex-shrink: 0;
    }
    .chip {
      border: 1px solid var(--line);
      background: var(--wash);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .cover-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 36px;
      width: min(100%, 720px);
      text-align: left;
    }
    .cover-row .step { min-height: 108px; }

    .foot {
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      padding: 4px 20px max(10px, env(safe-area-inset-bottom));
    }
    .foot-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .count {
      flex-shrink: 0;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .bars {
      display: flex;
      flex: 1;
      min-width: 0;
      gap: 4px;
    }
    .bars button {
      height: 8px;
      flex: 1;
      min-width: 0;
      border: 0;
      border-radius: 999px;
      background: var(--line);
      cursor: pointer;
      padding: 0;
    }
    .bars button.done { background: color-mix(in srgb, var(--ink) 45%, transparent); }
    .bars button.now { background: var(--ink); }
    .bars button.gap { margin-left: 8px; }
    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .keys { font-size: 12px; color: var(--muted); }

    .mobile-menu {
      display: none;
      position: absolute;
      z-index: 30;
      left: 16px;
      right: 16px;
      top: 52px;
      max-height: 60dvh;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      padding: 12px;
      box-shadow: 0 18px 48px -24px var(--shadow);
    }
    .mobile-menu.open { display: block; }
    .mobile-menu p {
      margin: 0 0 8px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .mobile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .mobile-grid button {
      text-align: left;
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      background: var(--wash);
      cursor: pointer;
    }
    .mobile-grid button.on { background: var(--ink); color: var(--paper); }

    @media (max-width: 1024px) {
      .jump { display: none; }
      .sections-toggle { display: inline; }
      .slide { padding: 18px 18px 22px; overflow-y: auto; }
      .contrast, .trio, .grid, .cover-row, .loop { grid-template-columns: 1fr; }
      .loop { grid-template-rows: none; }
      .loop .a, .loop .b, .loop .c, .loop .d, .loop .ab, .loop .bc, .loop .cd, .loop .da {
        grid-column: auto;
        grid-row: auto;
      }
      .loop .ab, .loop .bc, .loop .cd, .loop .da { display: none; }
      .flow { flex-direction: column; }
      .arrow { transform: rotate(90deg); align-self: center; }
      .keys { display: none; }
      .vs { flex-direction: row; padding: 4px 0; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="glow" aria-hidden="true"></div>

    <header class="top">
      <a class="brand" href="https://enaguthi.com">Abhishek Enaguthi</a>
      <div class="top-actions">
        <button type="button" class="ghost sections-toggle" id="menuBtn">Sections</button>
        <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Theme"></button>
        <button type="button" class="solid" id="fsBtn">Fullscreen</button>
      </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
      <p>Jump to section</p>
      <div class="mobile-grid" id="mobileNav"></div>
    </div>

    <div class="body">
      <aside class="jump">
        <p class="jump-label">Jump to</p>
        <nav id="jumpNav" aria-label="Deck sections"></nav>
      </aside>
      <section class="stage" id="stage"></section>
    </div>

    <footer class="foot">
      <div class="foot-inner">
        <div class="progress-row">
          <p class="count" id="count">1 / 9 · 8 left</p>
          <div class="bars" id="bars" role="tablist" aria-label="Slide position"></div>
        </div>
        <div class="nav-row">
          <button type="button" class="ghost" id="prev">Prev</button>
          <p class="keys">Arrow keys · swipe · F fullscreen</p>
          <button type="button" class="solid" id="next">Next</button>
        </div>
      </div>
    </footer>
  </div>

  <script>
    const X = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
    const AR = `<svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

    const SLIDES = [
      {
        id: "cover",
        nav: "Cover",
        layout: "cover",
        html: `
          <p class="eyebrow">Inferact · AMD GPU Performance Engineering</p>
          <h1>ROCm + HIP on POWER9</h1>
          <p class="lede">Wrong host. Make the GPU work. Then prove it.</p>
          <p class="hint">One project. Stop me anytime.</p>
          <div class="cover-row">
            <div class="step"><span class="n">1</span><strong>Wrong host</strong><span>ROCm wanted x86. We had POWER9.</span></div>
            <div class="step"><span class="n">2</span><strong>Make it run</strong><span>Build, drivers, libs — the ugly path.</span></div>
            <div class="step"><span class="n">3</span><strong>Prove it</strong><span>HIP smoke, then framework GPU util.</span></div>
          </div>
        `,
      },
      {
        id: "problem",
        nav: "Problem",
        layout: "fill",
        html: `
          <p class="eyebrow">The problem</p>
          <h1>ROCm assumed x86. We needed POWER9.</h1>
          <div class="grow">
            <div class="contrast">
              <div class="panel">
                <h2>What it expected</h2>
                <p class="mega">x86</p>
                <p>Built for normal PCs. Drivers and tools already fit.</p>
              </div>
              <div class="vs">
                <span class="x-mark">${X}</span>
                didn’t match
              </div>
              <div class="panel had">
                <h2>What we had</h2>
                <p class="mega">POWER9</p>
                <p>IBM machine. Different CPU. Different byte order.</p>
              </div>
            </div>
            <p class="job">Job: make ROCm + HIP actually run — not a paperweight GPU.</p>
          </div>
        `,
      },
      {
        id: "owned",
        nav: "Owned",
        layout: "fill",
        html: `
          <p class="eyebrow">What I owned</p>
          <h1>Build. Drivers. Libs. Proof.</h1>
          <div class="grow">
            <div class="flow">
              <div class="step"><span class="n">1</span><strong>CMake</strong><span>Build scripts for PowerPC. x86-only deps out.</span></div>
              ${AR}
              <div class="step"><span class="n">2</span><strong>ROCK</strong><span>Kernel modules so the driver talked to the GPU.</span></div>
              ${AR}
              <div class="step"><span class="n">3</span><strong>Libs</strong><span>Rebuild for that CPU — or shim if no source.</span></div>
              ${AR}
              <div class="step"><span class="n">4</span><strong>HIP</strong><span>A real kernel path, plus notes so someone else could rerun it.</span></div>
            </div>
            <p class="job">Enablement. Not a rewrite of ROCm.</p>
          </div>
        `,
      },
      {
        id: "hard",
        nav: "Hard",
        layout: "fill",
        html: `
          <p class="eyebrow">Why it was hard</p>
          <h1>Not a pip install.</h1>
          <div class="grow">
            <div class="trio">
              <div class="step">
                <span class="x-mark">${X}</span>
                <strong>Byte order</strong>
                <span>Guess wrong and numbers silently rot. That’s endianness.</span>
              </div>
              <div class="step">
                <span class="x-mark">${X}</span>
                <strong>x86 binaries</strong>
                <span>A lot of libs were already compiled. They won’t load on PowerPC.</span>
              </div>
              <div class="step">
                <span class="x-mark">${X}</span>
                <strong>Kernel drivers</strong>
                <span>User-mode isn’t enough. The driver thought the host was x86.</span>
              </div>
            </div>
          </div>
        `,
      },
      {
        id: "proof",
        nav: "Proof",
        layout: "fill",
        html: `
          <p class="eyebrow">Proof</p>
          <h1>Boring on purpose.</h1>
          <div class="grow">
            <div class="flow">
              <div class="step"><span class="n">1</span><strong>alloc</strong><span>hipMalloc on the GPU</span></div>
              ${AR}
              <div class="step"><span class="n">2</span><strong>copy in</strong><span>host → device</span></div>
              ${AR}
              <div class="step"><span class="n">3</span><strong>launch</strong><span>HIP matmul kernel</span></div>
              ${AR}
              <div class="step"><span class="n">4</span><strong>check</strong><span>copy back vs CPU</span></div>
            </div>
            <div class="chips">
              <span class="chip">Then PyTorch / TensorFlow smokes — GPU util, not hello-world</span>
              <span class="chip">Workspace written down so someone else could reproduce</span>
            </div>
          </div>
        `,
      },
      {
        id: "loop",
        nav: "Loop",
        layout: "fill",
        html: `
          <p class="eyebrow">How I work</p>
          <h1>Right first. Then one change.</h1>
          <div class="grow">
            <div class="loop">
              <div class="step a"><span class="n">1</span><strong>Minimal HIP</strong><span>Get one path green.</span></div>
              <span class="ab">${AR}</span>
              <div class="step b"><span class="n">2</span><strong>Where it hurts</strong><span>Look. Don’t guess.</span></div>
              <span class="bc arr-down">${AR}</span>
              <div class="step c"><span class="n">3</span><strong>One layer</strong><span>Flags, driver, or memory. Not five.</span></div>
              <span class="cd arr-left">${AR}</span>
              <div class="step d"><span class="n">4</span><strong>Re-check</strong><span>Still correct? Then next.</span></div>
              <span class="da arr-up">${AR}</span>
            </div>
            <p class="job">Same loop I’d bring to AMD in vLLM.</p>
          </div>
        `,
      },
      {
        id: "maps",
        nav: "This JD",
        layout: "fill",
        html: `
          <p class="eyebrow">This JD</p>
          <h1>The honest map.</h1>
          <div class="grow">
            <div class="grid">
              <div class="card had">
                <h2>Minimum — I have this</h2>
                <ul>
                  <li>ROCm, HIP, the AMD stack</li>
                  <li>Execution, memory, toolchain</li>
                  <li>Tests first. Then measure.</li>
                </ul>
              </div>
              <div class="card">
                <h2>Preferred — I won’t fake it</h2>
                <ul>
                  <li>Serving-adjacent. Not a vLLM PR.</li>
                  <li>Compiler grant if you pull it.</li>
                  <li>Triton: curious. Not shipped.</li>
                </ul>
              </div>
            </div>
          </div>
        `,
      },
      {
        id: "seat",
        nav: "This seat",
        layout: "fill",
        html: `
          <p class="eyebrow">This seat</p>
          <h1>Defaults still assume CUDA.</h1>
          <div class="grow">
            <div class="contrast">
              <div class="panel">
                <h2>The golden path</h2>
                <p class="mega">CUDA</p>
                <p>x86 host. NVIDIA default. Most stacks just work.</p>
              </div>
              <div class="vs">
                <span class="x-mark">${X}</span>
                not here
              </div>
              <div class="panel had">
                <h2>This job</h2>
                <p class="mega">AMD</p>
                <p>First-class in vLLM. Off-path until you make it real.</p>
              </div>
            </div>
            <p class="job">I’ve lived ROCm off that golden path. Bring-up, then honest numbers, then the hot path.</p>
          </div>
        `,
      },
      {
        id: "grant",
        nav: "Grant",
        appendix: true,
        layout: "fill",
        html: `
          <p class="eyebrow">Only if you want a second thread</p>
          <h1>Separate — compiler grant.</h1>
          <div class="grow">
            <div class="flow">
              <div class="step"><span class="n">1</span><strong>Measure</strong><span>Where the hot path actually is.</span></div>
              ${AR}
              <div class="step"><span class="n">2</span><strong>Change it</strong><span>One LLVM / ROCm path. Not a rewrite.</span></div>
              ${AR}
              <div class="step"><span class="n">3</span><strong>Re-measure</strong><span>~30% on those workloads. Not a blanket number.</span></div>
            </div>
            <p class="job">Not the same story as POWER9. Don’t mash them.</p>
          </div>
        `,
      },
    ];

    const stage = document.getElementById("stage");
    const jumpNav = document.getElementById("jumpNav");
    const mobileNav = document.getElementById("mobileNav");
    const bars = document.getElementById("bars");
    const count = document.getElementById("count");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const fsBtn = document.getElementById("fsBtn");
    const themeBtn = document.getElementById("themeBtn");
    const menuBtn = document.getElementById("menuBtn");
    const mobileMenu = document.getElementById("mobileMenu");

    const sun = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.1 5.1l1.6 1.6M17.3 17.3l1.6 1.6M18.9 5.1l-1.6 1.6M6.7 17.3l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
    const moon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 14.3A8.4 8.4 0 0 1 9.7 3 7.2 7.2 0 1 0 21 14.3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

    SLIDES.forEach((slide) => {
      const el = document.createElement("article");
      el.className = "slide " + (slide.layout || "fill");
      el.id = slide.id;
      el.innerHTML = slide.html;
      stage.appendChild(el);
    });

    const slideEls = Array.from(document.querySelectorAll(".slide"));
    const main = SLIDES.map((s, i) => ({ s, i })).filter(({ s }) => !s.appendix);
    const appendix = SLIDES.map((s, i) => ({ s, i })).filter(({ s }) => s.appendix);
    let i = 0;
    let appendixOpen = false;
    let touchX = null;
    let touchY = null;

    function indexFromHash() {
      const hash = location.hash.replace(/^#/, "");
      const found = SLIDES.findIndex((s) => s.id === hash);
      return found >= 0 ? found : 0;
    }

    function themeIcon() {
      const dark = document.documentElement.classList.contains("dark");
      themeBtn.innerHTML = dark ? sun : moon;
      themeBtn.title = dark ? "Light mode" : "Dark mode";
    }

    function applyTheme(mode) {
      document.documentElement.classList.toggle("dark", mode === "dark");
      try { localStorage.setItem("inferact-deck-theme", mode); } catch (e) {}
      themeIcon();
    }

    function renderJump() {
      const mk = (item, idx, on) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = item.nav;
        if (on) b.className = "on";
        b.onclick = () => go(idx);
        return b;
      };
      jumpNav.innerHTML = "";
      main.forEach(({ s, i: idx }) => jumpNav.appendChild(mk(s, idx, idx === i)));
      if (appendix.length) {
        const tog = document.createElement("button");
        tog.type = "button";
        tog.className = "appendix-toggle";
        tog.innerHTML = `<span>Appendix</span><span>${appendixOpen || SLIDES[i].appendix ? "▾" : "▸"}</span>`;
        tog.onclick = () => {
          appendixOpen = !appendixOpen;
          renderJump();
        };
        jumpNav.appendChild(tog);
        const wrap = document.createElement("div");
        wrap.className = "appendix-list" + (appendixOpen || SLIDES[i].appendix ? " open" : "");
        appendix.forEach(({ s, i: idx }) => wrap.appendChild(mk(s, idx, idx === i)));
        jumpNav.appendChild(wrap);
      }

      mobileNav.innerHTML = "";
      main.forEach(({ s, i: idx }) => {
        const b = mk(s, idx, idx === i);
        b.onclick = () => { go(idx); mobileMenu.classList.remove("open"); };
        mobileNav.appendChild(b);
      });
      appendix.forEach(({ s, i: idx }) => {
        const b = mk(s, idx, idx === i);
        b.onclick = () => { go(idx); mobileMenu.classList.remove("open"); };
        mobileNav.appendChild(b);
      });
    }

    function go(n) {
      i = Math.max(0, Math.min(n, SLIDES.length - 1));
      slideEls.forEach((el, k) => el.classList.toggle("on", k === i));
      const left = SLIDES.length - i - 1;
      count.textContent = `${i + 1} / ${SLIDES.length}` + (left > 0 ? ` · ${left} left` : " · last");
      prev.disabled = i === 0;
      next.disabled = i === SLIDES.length - 1;
      bars.querySelectorAll("button").forEach((b, k) => {
        b.className = k < i ? "done" : k === i ? "now" : "";
        if (SLIDES[k].appendix && !SLIDES[k - 1]?.appendix) b.classList.add("gap");
      });
      const id = SLIDES[i].id;
      history.replaceState(null, "", `${location.pathname}${location.search}#${id}`);
      if (SLIDES[i].appendix) appendixOpen = true;
      renderJump();
      menuBtn.textContent = "Sections";
    }

    bars.innerHTML = "";
    SLIDES.forEach((s, idx) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", `Go to ${s.nav}`);
      b.onclick = () => go(idx);
      bars.appendChild(b);
    });

    prev.onclick = () => go(i - 1);
    next.onclick = () => go(i + 1);
    fsBtn.onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
    themeBtn.onclick = () => {
      applyTheme(document.documentElement.classList.contains("dark") ? "light" : "dark");
    };
    menuBtn.onclick = () => {
      const open = mobileMenu.classList.toggle("open");
      menuBtn.textContent = open ? "Close" : "Sections";
    };

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        e.preventDefault();
        go(i + 1);
      }
      if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        go(i - 1);
      }
      if (e.key === "Home") go(0);
      if (e.key === "End") go(SLIDES.length - 1);
      if (e.key === "f" || e.key === "F") {
        e.preventDefault();
        fsBtn.click();
      }
      if (e.key === "Escape") mobileMenu.classList.remove("open");
    });

    const app = document.getElementById("app");
    app.addEventListener("touchstart", (e) => {
      const t = e.changedTouches[0];
      if (!t) return;
      touchX = t.clientX;
      touchY = t.clientY;
    }, { passive: true });
    app.addEventListener("touchend", (e) => {
      const t = e.changedTouches[0];
      if (!t || touchX == null) return;
      const dx = t.clientX - touchX;
      const dy = t.clientY - touchY;
      touchX = touchY = null;
      if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
      if (dx < 0) go(i + 1);
      else go(i - 1);
    });

    (function initTheme() {
      let mode = "dark";
      try {
        const stored = localStorage.getItem("inferact-deck-theme");
        if (stored === "light" || stored === "dark") mode = stored;
      } catch (e) {}
      applyTheme(mode);
    })();

    go(indexFromHash());
    window.addEventListener("hashchange", () => go(indexFromHash()));
  </script>
</body>
</html>
