name: Update GitHub activity

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update-github-activity:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitHub activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: Abhishek21g
        run: node scripts/fetch-github-activity.mjs /tmp/github-activity.json

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish GitHub activity JSON
        run: |
          mkdir -p gh-pages/live
          cp /tmp/github-activity.json gh-pages/live/github-activity.json
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/github-activity.json
          git diff --cached --quiet || git commit -m "Update GitHub activity"
          for attempt in 1 2 3; do
            git pull --rebase origin gh-pages
            git push && exit 0
            sleep 3
          done
          exit 1
